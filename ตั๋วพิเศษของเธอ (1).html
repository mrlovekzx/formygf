<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตั๋วพิเศษของเธอ</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  --bg:#2a1830; --bg2:#3b2142; --paper:#fff4ea; --ink:#3a2236; --rose:#e8577a;
  --gold:#f2b84b; --muted:#8c7288; --ok:#3f9d6b;
  --card:#fff4ea; --line:rgba(58,34,54,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; font-family:'Prompt',system-ui,sans-serif; color:var(--paper);
  background:radial-gradient(1200px 600px at 50% -10%,var(--bg2),var(--bg));
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.wrap{max-width:460px;margin:0 auto;padding:32px 20px 60px}
h1{font-family:'Mali',cursive;font-size:2rem;margin:8px 0 4px;text-align:center}
.sub{text-align:center;color:#d9c3d6;margin:0 0 28px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ตั๋ว */
.ticket{
  position:relative; display:grid; grid-template-rows:auto auto; margin:0 0 22px;
  color:var(--ink); filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));
  transition:transform .7s cubic-bezier(.5,0,.8,.4),opacity .7s;
}
.t-main,.t-stub{background:var(--card);padding:20px 22px;position:relative}
.t-main{border-radius:16px 16px 0 0;display:flex;gap:16px;align-items:center;
  background-image:radial-gradient(circle at 0 100%,transparent 12px,var(--card) 13px);}
.t-main{ -webkit-mask:radial-gradient(circle 12px at 0 100%,#0000 98%,#000) left/51% 100% no-repeat,
  radial-gradient(circle 12px at 100% 100%,#0000 98%,#000) right/51% 100% no-repeat; mask:radial-gradient(circle 12px at 0 100%,#0000 98%,#000) left/51% 100% no-repeat,
  radial-gradient(circle 12px at 100% 100%,#0000 98%,#000) right/51% 100% no-repeat;}
.t-stub{border-radius:0 0 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;
  -webkit-mask:radial-gradient(circle 12px at 0 0,#0000 98%,#000) left/51% 100% no-repeat,
  radial-gradient(circle 12px at 100% 0,#0000 98%,#000) right/51% 100% no-repeat; mask:radial-gradient(circle 12px at 0 0,#0000 98%,#000) left/51% 100% no-repeat,
  radial-gradient(circle 12px at 100% 0,#0000 98%,#000) right/51% 100% no-repeat;
  transform-origin:12% 0;transition:transform .6s ease-in,opacity .6s}
.t-main::after{content:"";position:absolute;left:18px;right:18px;bottom:0;border-bottom:2px dashed var(--line)}
.emoji{font-size:2.6rem;line-height:1}
.t-title{font-family:'Mali',cursive;font-size:1.35rem;font-weight:700;margin:0}
.t-desc{margin:4px 0 0;color:#5b4457;font-size:.95rem}
.t-exp{font-size:.8rem;color:var(--muted)}
.use{
  font:600 1rem 'Prompt',sans-serif;border:0;border-radius:999px;background:var(--rose);color:#fff;
  padding:12px 22px;cursor:pointer;box-shadow:0 4px 0 #b83a5a;transition:transform .1s,box-shadow .1s;
}
.use:active{transform:translateY(3px);box-shadow:0 1px 0 #b83a5a}

/* ตอนใช้ตั๋ว: ฉีกที่รอยปรุ แล้วหาย */
.ticket.tearing .t-stub{transform:rotate(9deg) translate(26px,70px);opacity:0}
.ticket.tearing{transition-delay:.55s}
.ticket.gone{transform:translateY(-30px) scale(.96);opacity:0}
@media (prefers-reduced-motion:reduce){.ticket,.t-stub{transition:opacity .2s!important}.ticket.tearing .t-stub{transform:none}}

.empty{text-align:center;color:#d9c3d6;padding:40px 10px;border:2px dashed rgba(255,255,255,.2);border-radius:16px}

/* กล่องยืนยัน */
dialog{border:0;border-radius:18px;background:var(--paper);color:var(--ink);padding:26px;max-width:340px;text-align:center}
dialog::backdrop{background:rgba(20,8,24,.65)}
dialog h2{font-family:'Mali',cursive;margin:0 0 6px}
.row{display:flex;gap:10px;justify-content:center;margin-top:18px}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:10px 20px;font:500 1rem 'Prompt'}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--paper);color:var(--ink);
  padding:12px 20px;border-radius:999px;font-weight:500;box-shadow:0 8px 20px rgba(0,0,0,.4)}

/* หลังบ้าน */
.panel{background:var(--paper);color:var(--ink);border-radius:16px;padding:20px;margin-bottom:22px}
.panel h2{font-family:'Mali',cursive;margin:0 0 12px}
label{display:block;font-size:.9rem;margin:10px 0 4px;color:#5b4457}
input,textarea{width:100%;font:1rem 'Prompt';padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.admin-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.admin-item small{color:var(--muted);display:block}
.badge{font-size:.78rem;padding:2px 10px;border-radius:999px;background:#e9f6ef;color:var(--ok)}
.badge.used{background:#fdebf0;color:#b83a5a}
.mini{border:0;background:#efe3ea;color:var(--ink);border-radius:8px;padding:6px 10px;font:500 .85rem 'Prompt';cursor:pointer}
.mini.del{background:#fdebf0;color:#b83a5a}
.err{color:#ffb3c4;text-align:center;min-height:1.4em}

.tabs{display:flex;justify-content:center;gap:8px;margin:-10px 0 22px}
.tabs button{font:500 .9rem 'Prompt';border:2px solid rgba(255,255,255,.25);background:transparent;color:#f3e4f0;border-radius:999px;padding:6px 16px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.note{font-size:.82rem;color:#cdb6ca;text-align:center;margin-top:26px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <h1>ตั๋วพิเศษของเธอ 🎟️</h1>
  <p class="sub" id="sub">กดใช้ได้ตอนไหนก็ได้ แต่ใช้แล้วใช้เลยนะ</p>
  <div class="tabs" id="tabs" hidden>
    <button id="tabHer" aria-pressed="true">หน้าของเธอ</button>
    <button id="tabAdmin" aria-pressed="false">หลังบ้าน</button>
  </div>

  <section id="her"><div id="list" aria-live="polite"></div></section>

  <section id="admin" hidden>
    <div class="panel">
      <h2>สร้างตั๋วใหม่</h2>
      <label for="emoji">อีโมจิ</label><input id="emoji" value="🎟️" maxlength="4">
      <label for="title">ชื่อตั๋ว</label><input id="title" placeholder="เช่น ตั๋วฟรีนวดไหล่" maxlength="80">
      <label for="desc">รายละเอียด</label><textarea id="desc" rows="2" maxlength="300"></textarea>
      <label for="exp">วันหมดอายุ (ไม่ใส่ก็ได้)</label><input id="exp" type="date">
      <div class="row"><button class="use" id="addBtn">สร้างตั๋ว</button></div>
      <p class="err" id="addErr" style="color:#b83a5a"></p>
    </div>
    <div class="panel"><h2>ตั๋วทั้งหมด</h2><div id="items"></div></div>
  </section>

  <p class="note" id="note"></p>
</main>

<dialog id="confirm">
  <h2 id="cTitle"></h2>
  <p>แน่ใจนะว่าจะใช้ตั๋วใบนี้ตอนนี้? ใช้แล้วตั๋วจะหายไปเลย</p>
  <div class="row"><button class="ghost" id="cNo">ยังก่อน</button><button class="use" id="cYes">ใช้เลย</button></div>
</dialog>
<div id="toast" class="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = d => new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
const fmtT = d => new Date(d).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
const toast = m => { const t=$('toast'); t.textContent=m; t.hidden=false; setTimeout(()=>t.hidden=true,2600); };

let tickets = [], used = {}, mode = 'local', canAdmin = false, view = 'her', db = null, pending = null, busy = false;

/* ---------- เก็บข้อมูลในเครื่อง (ใช้เมื่อยังไม่ได้เชื่อมระบบร่วม) ---------- */
const ls = {
  get(k, f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch{ return f; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
function loadLocal(){
  tickets = ls.get('lt_tickets', null);
  if(!tickets){
    tickets = [
      {id:'d1',emoji:'💆',title:'ตั๋วฟรีนวดไหล่',description:'นวดให้ 15 นาที ไม่บ่นสักคำ',expiresAt:null,createdAt:'2026-11-07T00:00:03Z'},
      {id:'d2',emoji:'🍜',title:'ตั๋วเลือกร้านอาหาร',description:'วันนี้เธอเลือกเอง ไม่มีคำว่า "ได้หมด"',expiresAt:null,createdAt:'2026-11-07T00:00:02Z'},
      {id:'d3',emoji:'🎬',title:'ตั๋วดูหนังด้วยกัน',description:'เรื่องอะไรก็ได้ที่เธออยากดู',expiresAt:null,createdAt:'2026-11-07T00:00:01Z'}
    ];
    ls.set('lt_tickets', tickets);
  }
  used = ls.get('lt_used', {});
}

/* ---------- การกระทำ ---------- */
async function addTicket(t){
  if(mode === 'shared') await db.collection('tickets').doc(t.id).set(t);
  else { tickets.unshift(t); ls.set('lt_tickets', tickets); render(); }
}
async function markUsed(id){
  const at = new Date().toISOString();
  if(mode === 'shared') await db.collection('uses').doc(id).set({at});
  else { used[id] = at; ls.set('lt_used', used); }
}
async function resetUse(id){
  if(mode === 'shared') await db.collection('uses').doc(id).delete();
  else { delete used[id]; ls.set('lt_used', used); render(); }
}
async function delTicket(id){
  if(mode === 'shared') await db.collection('tickets').doc(id).delete();
  else { tickets = tickets.filter(t => t.id !== id); ls.set('lt_tickets', tickets); render(); }
}

/* ---------- แสดงผล ---------- */
function render(){
  if(busy) return;
  const now = Date.now();
  const live = tickets.filter(t => !used[t.id] && (!t.expiresAt || new Date(t.expiresAt).getTime() + 86400000 > now));
  $('list').innerHTML = live.length ? live.map(t => `
    <article class="ticket" data-id="${esc(t.id)}">
      <div class="t-main"><div class="emoji" aria-hidden="true">${esc(t.emoji)}</div>
        <div><h2 class="t-title">${esc(t.title)}</h2>${t.description ? `<p class="t-desc">${esc(t.description)}</p>` : ''}</div></div>
      <div class="t-stub"><span class="t-exp">${t.expiresAt ? 'ใช้ได้ถึง ' + fmtD(t.expiresAt) : 'ไม่มีวันหมดอายุ'}</span>
        <button class="use" data-use="${esc(t.id)}" data-title="${esc(t.title)}">ใช้ตั๋ว</button></div>
    </article>`).join('')
    : '<div class="empty">ตอนนี้ยังไม่มีตั๋วที่ใช้ได้<br>รอรับตั๋วใบใหม่จากเขานะ 💌</div>';

  $('items').innerHTML = tickets.length ? tickets.map(t => `
    <div class="admin-item">
      <div>${esc(t.emoji)} <strong>${esc(t.title)}</strong>
        <small>${used[t.id] ? 'ใช้เมื่อ ' + fmtT(used[t.id]) : (t.expiresAt ? 'หมดอายุ ' + esc(t.expiresAt) : 'ไม่มีวันหมดอายุ')}</small></div>
      <div><span class="badge ${used[t.id] ? 'used' : ''}">${used[t.id] ? 'ใช้แล้ว' : 'ยังไม่ใช้'}</span>
        ${used[t.id] ? `<button class="mini" data-reset="${esc(t.id)}">คืนตั๋ว</button>` : ''}
        <button class="mini del" data-del="${esc(t.id)}">ลบ</button></div>
    </div>`).join('') : '<p>ยังไม่มีตั๋ว สร้างใบแรกได้เลย</p>';
}

function setView(v){
  view = v;
  $('her').hidden = v !== 'her'; $('admin').hidden = v !== 'admin';
  $('tabHer').setAttribute('aria-pressed', v === 'her'); $('tabAdmin').setAttribute('aria-pressed', v === 'admin');
}
function setAdmin(on){
  canAdmin = on; $('tabs').hidden = !on; if(!on) setView('her');
}
function setNote(){
  $('note').textContent = mode === 'shared'
    ? 'เชื่อมระบบร่วมแล้ว ตั๋วที่เพิ่มจะขึ้นให้อีกฝั่งเห็นทันที'
    : 'ตอนนี้เก็บข้อมูลในเครื่องนี้เท่านั้น (ยังไม่ได้แชร์ข้ามเครื่อง)';
}

/* ---------- เหตุการณ์ ---------- */
$('list').addEventListener('click', e => {
  const b = e.target.closest('[data-use]'); if(!b) return;
  pending = b.dataset.use; $('cTitle').textContent = b.dataset.title; $('confirm').showModal();
});
$('cNo').onclick = () => $('confirm').close();
$('cYes').onclick = () => {
  $('confirm').close();
  const el = $('list').querySelector(`[data-id="${CSS.escape(pending)}"]`); if(!el) return;
  const id = pending; busy = true;
  el.classList.add('tearing');
  setTimeout(() => el.classList.add('gone'), 600);
  setTimeout(async () => {
    try{ await markUsed(id); toast('ใช้ตั๋วแล้ว! บอกเขาได้เลย 💕'); }
    catch{ toast('ใช้ตั๋วไม่สำเร็จ ลองใหม่อีกครั้งนะ'); }
    busy = false; render();
  }, 1300);
};
$('tabHer').onclick = () => setView('her');
$('tabAdmin').onclick = () => setView('admin');
$('addBtn').onclick = async () => {
  const title = $('title').value.trim();
  if(!title){ $('addErr').textContent = 'ใส่ชื่อตั๋วก่อน'; return; }
  const t = { id: (crypto.randomUUID ? crypto.randomUUID() : 't' + Date.now()), title,
    description: $('desc').value.trim(), emoji: $('emoji').value || '🎟️',
    expiresAt: $('exp').value || null, createdAt: new Date().toISOString() };
  try{ await addTicket(t); $('title').value = $('desc').value = $('exp').value = ''; $('addErr').textContent = ''; toast('สร้างตั๋วแล้ว'); }
  catch{ $('addErr').textContent = 'สร้างตั๋วไม่สำเร็จ ลองใหม่อีกครั้ง'; }
};
$('items').addEventListener('click', async e => {
  const d = e.target.dataset;
  try{
    if(d.del && confirm('ลบตั๋วใบนี้?')) await delTicket(d.del);
    if(d.reset) await resetUse(d.reset);
  }catch{ toast('ทำรายการไม่สำเร็จ'); }
});

/* ---------- เริ่มต้น: แสดงแบบในเครื่องก่อน แล้วค่อยต่อระบบร่วมถ้ามี ---------- */
loadLocal();
canAdmin = location.hash === '#admin'; setAdmin(canAdmin);
setNote(); render();

(async () => {
  try{
    const c = window.claude && await claude.use('db');
    if(!c) return;
    db = c; mode = 'shared';
    const user = await claude.use('user');
    setAdmin(user ? await user.canEdit() : false);
    tickets = []; used = {}; render(); setNote();
    db.collection('tickets').onSnapshot(s => {
      tickets = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)));
      render();
    }, () => {});
    db.collection('uses').onSnapshot(s => {
      used = {}; s.docs.forEach(d => used[d.id] = (d.data() || {}).at || true); render();
    }, () => {});
  }catch{}
})();
</script>
</body>
</html>
